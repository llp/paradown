[package]
name = "paradown-libtorrent-engine"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
cxx = { version = "1.0", optional = true }
paradown = { path = "../.." }
tokio = { version = "1", features = ["rt", "sync", "time"] }

[build-dependencies]
cxx-build = { version = "1.0", optional = true }
pkg-config = { version = "0.3", optional = true }

[features]
default = []
native-libtorrent = ["dep:cxx", "dep:cxx-build", "dep:pkg-config"]
static-libtorrent = ["native-libtorrent"]
static-boost = ["native-libtorrent"]
static-ssl = ["native-libtorrent"]

[[bin]]
name = "paradown-libtorrent"
path = "src/bin/paradown-libtorrent.rs"
required-features = ["native-libtorrent"]
