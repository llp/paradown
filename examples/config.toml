# paradown example configuration
#
# Load with:
#   cargo run --all-features -- --config ./examples/config.toml --urls https://example.com/file.iso
#
# Paths are resolved relative to the current working directory.

schema_version = 1
download_dir = "./downloads"
shuffle_tasks = false
concurrent_tasks = 4
segments_per_task = 4
rate_limit_kib_per_sec = 512
connect_timeout_secs = 30
storage_backend = { Sqlite = "./downloads.db" }
# Alternative lightweight state file:
# storage_backend = { JsonFile = "./downloads.json" }
file_conflict_strategy = "Resume"
log_level = "info"
completion_hook = "echo paradown finished: completed=$PARADOWN_COMPLETED failed=$PARADOWN_FAILED"

[retry]
max_retries = 3
initial_delay = 1
max_delay = 30
backoff_factor = 2.0

[progress_throttle]
interval_ms = 200
threshold_bytes = 1048576

[p2p]
enabled = true

[p2p.libtorrent]
alert_queue_size = 1024
enable_dht = true
enable_lsd = true
enable_upnp = true
enable_natpmp = true
# listen_interfaces = "0.0.0.0:6881"

[p2p.swarm]
enabled = true
include_magnet_hints = true
# cache_dir = "./downloads/.paradown/swarm-cache"
# static_trackers = ["udp://tracker.example:1337/announce"]
# static_tracker_files = ["./trackers.txt"]
# static_peers = ["127.0.0.1:6881"]
# static_web_seeds = ["https://seed.example/payload"]
# tracker_list_urls = ["https://example.com/trackers.txt"]
tracker_list_cache_ttl_secs = 86400
tracker_list_timeout_secs = 15
# discovery_files = ["./release-page.html"]
# discovery_urls = ["https://example.com/releases.xml"]
discovery_input_kind = "Auto"
discovery_timeout_secs = 15

[p2p.swarm.limits]
max_trackers = 128
max_peers = 64
max_web_seeds = 64
max_locators = 64
max_diagnostics = 64

[http.client]
cookie_store = false
# cookie_jar_path = "./cookies/session.json"

[http.client.tls]
insecure_skip_verify = false
# ca_certificate_pem = "./certs/internal-root.pem"
# client_identity_pem = "./certs/client-identity.pem"

[http.client.proxy]
use_env_proxy = true

[http.request]
user_agent = "paradown/0.1.1"

[[http.request.headers]]
name = "Accept"
value = "*/*"
